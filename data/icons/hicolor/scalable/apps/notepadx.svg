<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 1530" width="1530" height="1530">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#587a45"/>
      <stop offset="1" stop-color="#44623a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c4640"/>
      <stop offset="0.5" stop-color="#1b2e2b"/>
      <stop offset="1" stop-color="#101d1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.6" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#b9cf7f" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#c3d68a"/>
      <stop offset="1" stop-color="#9fbb6a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="flipper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d4a3f"/>
      <stop offset="0.5" stop-color="#1a2e2b"/>
      <stop offset="1" stop-color="#0e1b1b"/>
    </linearGradient>
    <linearGradient id="head" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f6f8"/>
      <stop offset="1" stop-color="#8fa5b5"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b544"/>
      <stop offset="1" stop-color="#e58b1e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e7e3"/>
    </linearGradient>
    <linearGradient id="xg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#b2de3e"/>
      <stop offset="0.55" stop-color="#8ecb2a"/>
      <stop offset="1" stop-color="#5aa81e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1530" height="1530" fill="url(#bg)"/>

  <!-- Penguin body -->
  <path d="M230 1420 C150 1300 60 1100 100 900 C140 700 300 500 400 340 C480 200 620 110 780 100 C940 100 1040 190 1070 300 L1200 640 C1300 760 1400 900 1390 1100 C1380 1250 1300 1350 1200 1400 L500 1440 Z" fill="url(#body)"/>
  <path d="M215 1385 C120 1270 80 1080 110 900 C150 700 300 500 410 330 C500 190 640 90 790 80 C900 78 990 130 1040 190" fill="none" stroke="url(#rim)" stroke-width="16" stroke-linecap="round"/>

  <!-- Head -->
  <path d="M650 550 C625 400 660 250 820 200 C950 170 1040 260 1050 330 L1050 500 C1040 540 1000 552 960 552 Z" fill="url(#head)"/>
  <!-- Beak -->
  <path d="M990 335 C1050 288 1130 318 1170 372 C1160 400 1100 420 1030 470 C990 472 960 425 960 402 Z" fill="url(#beak)"/>
  <path d="M962 402 C1040 412 1120 402 1168 380 C1150 405 1100 425 1030 470 C990 472 962 430 962 402 Z" fill="#2a2440" opacity="0.55"/>
  <!-- Eye -->
  <circle cx="830" cy="340" r="58" fill="#0b0b0f"/>
  <circle cx="806" cy="316" r="14" fill="#fff"/>
  <circle cx="853" cy="360" r="7" fill="#fff" opacity="0.8"/>

  <!-- Paper -->
  <g filter="url(#shadow)">
    <rect x="335" y="552" width="870" height="890" rx="88" fill="url(#paper)" stroke="#f4f4f1" stroke-width="6"/>
  </g>
  <g fill="#c9c9c4">
    <rect x="500" y="738" width="598" height="40"/>
    <rect x="500" y="884" width="598" height="62"/>
    <rect x="500" y="1052" width="598" height="62"/>
    <rect x="500" y="1225" width="598" height="60"/>
  </g>

  <!-- Flipper (in front of paper) -->
  <path d="M350 690 C338 760 380 830 440 880 C520 1000 565 1150 522 1262 C490 1292 430 1282 380 1240 C260 1130 190 1000 180 850 C250 800 320 750 350 690 Z" fill="url(#flipper)" filter="url(#soft)"/>

  <!-- X -->
  <path d="M895 905 Q895 895 910 895 L1025 895 Q1040 895 1048 908 L1138 1040 L1235 908 Q1245 895 1260 895 L1375 895 Q1392 900 1385 915 L1225 1150 L1395 1375 Q1402 1395 1380 1405 L1255 1408 Q1240 1408 1230 1395 L1140 1265 L1050 1395 Q1040 1408 1025 1408 L895 1410 Q875 1405 885 1385 L1055 1150 Z"
        fill="url(#xg)" stroke="#c6ec6a" stroke-width="8" stroke-linejoin="round" filter="url(#soft)"/>
</svg>
